<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노담나무 만들기</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Malgun Gothic', sans-serif;
        background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    header {
        text-align: center;
        padding: 25px 10px 15px;
    }

    h1 {
        margin: 0 0 8px 0;
        font-size: 36px;
        color: #1b5e20;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: #43a047;
    }

    .input-box {
        background: white;
        padding: 15px 25px;
        border-radius: 50px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
        align-items: center;
    }

    input {
        padding: 10px 15px;
        border: 2px solid #a5d6a7;
        border-radius: 25px;
        font-size: 14px;
        outline: none;
        transition: 0.3s;
    }

    input:focus {
        border-color: #4caf50;
    }

    #nameInput { width: 90px; text-align: center; }
    #textInput { width: 25px; flex-grow: 1; min-width: 220px; }

    button {
        padding: 10px 22px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #2e7d32;
        transform: scale(1.05);
    }

    #growth-msg {
        font-size: 16px;
        font-weight: bold;
        color: #2e7d32;
        background: rgba(255,255,255,0.8);
        padding: 5px 15px;
        border-radius: 20px;
        margin-bottom: 15px;
    }

    #tree-box {
        width: 600px;
        height: 600px;
        background: white;
        border-radius: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        position: relative;
        overflow: hidden;
        border: 4px solid #ffffff;
    }
    
    #dynamic-tree {
        position: absolute;
        left: 50%;
        top: 48%;
        transform: translate(-50%, -50%) scale(1.0);
        font-size: 340px;
        line-height: 1;
        pointer-events: none;
        transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        user-select: none;
        z-index: 1;
    }

    #tree-area {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 2;
    }

    .leaf {
        position: absolute;
        font-size: 32px; /* 눈에 잘 띄게 크기 고정 */
        transform: translate(-50%, -50%) scale(0);
        animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        user-select: none;
    }

    @keyframes pop {
        to { transform: translate(-50%, -50%) scale(1); }
    }

    #log {
        width: 600px;
        max-height: 200px;
        margin: 25px 0 40px;
        background: rgba(255, 255, 255, 0.9);
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        overflow-y: auto;
        box-sizing: border-box;
    }

    #log b {
        color: #1b5e20;
        font-size: 16px;
        display: block;
        margin-bottom: 10px;
        border-bottom: 2px solid #c8e6c9;
        padding-bottom: 5px;
    }

    .log-item {
        border-bottom: 1px dashed #e0e0e0;
        padding: 8px 5px;
        font-size: 14px;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-50%); }
        to { opacity: 1; transform: translateY(0); }
    }

    .name {
        font-weight: bold;
        color: #2e7d32;
        background: #e8f5e9;
        padding: 2px 8px;
        border-radius: 10px;
        margin-right: 5px;
    }
</style>
</head>

<body>

<header>
    <h1>🌳 노담나무 🌳</h1>
    <h2>흡연 권유 거절, 노담 실천 문구 작성하기</h2>
</header>

<div class="input-box">
    <input id="nameInput" placeholder="이름" maxlength="5"/>
    <input id="textInput" placeholder="예) 담배는 우리 몸을 아프게 해! 안 피울 거야!" />
    <button onclick="addEntry()">나무 가꾸기</button>
</div>

<div id="growth-msg">🌱 현재 나무 상태: 아기 씨앗 단계 (잎 0개)</div>

<div id="tree-box">
    <div id="dynamic-tree">🌳</div>
    <div id="tree-area"></div>
</div>

<div id="log">
    <b>📌 우리가 만든 노담 기록장</b>
    <div id="log-list"></div>
</div>

<!-- 파이어베이스 라이브러리 엔진 -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
// 선생님의 실제 파이어베이스 설정값
const firebaseConfig = {
  apiKey: "AIzaSyALLfaAws-3eXrnb_gBv9ynEZBuJMc6AGg",
  authDomain: "tree-8c864.firebaseapp.com",
  projectId: "tree-8c864",
  storageBucket: "tree-8c864.firebasestorage.app",
  messagingSenderId: "434728258229",
  appId: "1:434728258229:web:ac4d19f209c21d25a6ccfc",
  measurementId: "G-D0KRL6KJ06"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore(); 

const treeArea = document.getElementById("tree-area");
const logList = document.getElementById("log-list");
const dynamicTree = document.getElementById("dynamic-tree");
const growthMsg = document.getElementById("growth-msg");

let leafCount = 0; 

// 나무 성장 상태 단계 스케일 조절
function updateTreeGrowth() {
    let scale = 1.0;
    let statusText = "";

    if (leafCount === 0) { scale = 0.8; statusText = "🌱 아기 씨앗 단계 (잎 0개)"; }
    else if (leafCount <= 3) { scale = 0.9; statusText = "🌿 새싹 단계 (첫 걸음마!)"; }
    else if (leafCount <= 7) { scale = 1.0; statusText = "🌳 성장기 단계 (나무가 자라나요)"; }
    else if (leafCount <= 12) { scale = 1.12; statusText = "🌿 풍성 단계 (초록 잎이 가득!)"; }
    else if (leafCount <= 18) { scale = 1.22; statusText = "🌸 꽃길 단계 (꽃이 활짝 피어납니다)"; }
    else { scale = 1.30; statusText = "👑 울창한 노담 숲 단계 (최고의 노담 나무 탄생!)"; }

    dynamicTree.style.transform = `translate(-50%, -50%) scale(${scale})`;
    growthMsg.innerText = `✨ 현재 나무 상태: ${statusText}`;
}

updateTreeGrowth();

// [핵심 변경] 나선형 알고리즘: 순번(index)을 받아서 겹치지 않고 둥글게 퍼지도록 좌표 계산
// 중앙(300, 220)에서 출발해 나무 이모지 왕관 몸통 내부에 꽉 차게 배치됩니다.
function getSpiralPosition(index) {
    const centerX = 300;
    const centerY = 215; // 나무 이모지 잎사귀 정중앙 타원 매칭 크기
    
    // 황금각 피보나치 나선 구조 활용하여 균일 분산
    const angle = index * 2.39996; 
    const radius = 26 * Math.sqrt(index + 1); // 잎 간격 26px로 절대 안 겹치게 유지

    // 압축 계수를 주어 둥근 타원형(가로 140%, 세로 110%) 구조로 나무 틀에 완벽 밀착
    const x = centerX + Math.cos(angle) * radius * 1.4;
    const y = centerY + Math.sin(angle) * radius * 1.1;

    return { x: Math.round(x), y: Math.round(y) };
}

// 데이터 저장 (글을 쓸 때는 데이터만 파이어베이스에 순서대로 차곡차곡 쌓음)
function addEntry() {
    const nameInput = document.getElementById("nameInput");
    const textInput = document.getElementById("textInput");
    const name = nameInput.value.trim();
    const text = textInput.value.trim();

    if (!name || !text) {
        alert("이름과 노담 문장을 모두 입력해주세요! 😊");
        return;
    }

    const items = ["🍃", "🌸", "🌿", "🍀", "🌼", "🌱"];
    const randomLeaf = items[Math.floor(Math.random() * items.length)];

    db.collection("nodamTree").add({
        studentName: name,
        nodamText: text,
        leafType: randomLeaf,
        timestamp: firebase.firestore.FieldValue.serverTimestamp() // 시간순 정렬용
    })
    .then(() => {
        textInput.value = "";
        textInput.focus();
    })
    .catch((error) => { console.error("데이터 저장 실패: ", error); });
}

// 실시간 DB 반영: 불러온 전체 데이터의 '순서(index)'대로 나선형 좌표를 매겨 화면에 고정 출력
db.collection("nodamTree")
    .orderBy("timestamp", "asc")
    .onSnapshot((snapshot) => {
        treeArea.innerHTML = "";
        logList.innerHTML = "";
        leafCount = 0;            

        snapshot.forEach((doc) => {
            const data = doc.data();
            const name = data.studentName;
            const text = data.nodamText;
            const leafType = data.leafType || "🍃";

            // 1. 하단 리스트 추가
            const item = document.createElement("div");
            item.className = "log-item";
            item.innerHTML = `<span class="name">${name}</span> ${text}`;
            logList.insertBefore(item, logList.firstChild);

            // 2. 현재 누적된 leafCount 순번에 맞는 나선 좌표 부여 (겹침 제로, 이탈 제로, 순간이동 제로)
            const pos = getSpiralPosition(leafCount);

            const leaf = document.createElement("div");
            leaf.className = "leaf";
            leaf.innerText = leafType;
            leaf.style.left = pos.x + "px";
            leaf.style.top = pos.y + "px";

            treeArea.appendChild(leaf);
            leafCount++;
        });
        updateTreeGrowth();
    });

document.getElementById("textInput").addEventListener("keyup", function(event) {
    if (event.key === "Enter") { addEntry(); }
});
</script>
</body>
</html>
