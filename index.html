<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>흡연 권유 거절 나무</title>

<style>
body{
    text-align:center;
    background:#eef9ee;
    font-family:Arial;
}

h1{
    color:#2e7d32;
}

#treeArea{
    position:relative;
    width:500px;
    height:600px;
    margin:auto;
    border:1px solid #ddd;
    background:white;
    overflow:hidden;
}

/* 🌳 줄기 */
#trunk{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    font-size:160px;
}

/* 🍃 */
.leaf{
    position:absolute;
    font-size:26px;
    transition:0.3s;
}

/* 📋 */
#log{
    width:500px;
    margin:auto;
    text-align:left;
    background:white;
    padding:10px;
    margin-top:10px;
    height:150px;
    overflow:auto;
}
</style>
</head>

<body>

<h1>🚫 흡연 권유 거절 나무 🚫</h1>

<input id="name" placeholder="이름">
<input id="text" placeholder="거절 문구">
<button onclick="addLeaf()">등록</button>

<div id="treeArea">
    <div id="trunk">🌳</div>
</div>

<h3>📋 기록</h3>
<div id="log"></div>

<script>

const positions = [];

/* 🌳 충돌 없는 “원형 확산” 위치 생성 */
function getSpreadPosition(){

    const centerX = 250;
    const centerY = 450;

    for(let i=0;i<200;i++){

        // 🌳 반지름이 점점 커짐 (확산 느낌)
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * 200;

        const x = centerX + Math.cos(angle) * radius;
        const y = centerY - Math.sin(angle) * radius;

        let ok = true;

        // 🚫 겹침 방지
        for(const p of positions){
            const dx = p.x - x;
            const dy = p.y - y;

            if(Math.sqrt(dx*dx + dy*dy) < 30){
                ok = false;
                break;
            }
        }

        if(ok){
            positions.push({x,y});
            return {x,y};
        }
    }

    // fallback
    return {x:250,y:450};
}

function addLeaf(){

    const name = document.getElementById("name").value;
    const text = document.getElementById("text").value;

    if(name === "" || text === "") return;

    const pos = getSpreadPosition();

    const leaf = document.createElement("div");
    leaf.className = "leaf";

    leaf.innerHTML = Math.random()>0.5 ? "🚫" : "🍃";

    leaf.style.left = pos.x + "px";
    leaf.style.top = pos.y + "px";

    leaf.title = name + " : " + text;

    document.getElementById("treeArea").appendChild(leaf);

    document.getElementById("log").innerHTML +=
        `🚫 <b>${name}</b> : ${text}<br>`;

    document.getElementById("text").value = "";
}

</script>

</body>
</html>
