<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노담나무 만들기</title>

<style>
    body {
        margin: 0;
        padding: 0 10px; /* 모바일 양옆 여백 */
        font-family: 'Malgun Gothic', sans-serif;
        background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
    }

    header {
        text-align: center;
        padding: 20px 10px 10px;
    }

    h1 {
        margin: 0 0 5px 0;
        font-size: 28px; /* 모바일 기준 서체 축소 */
        color: #1b5e20;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: #43a047;
    }

    /* 입력 상자 모바일 최적화 */
    .input-box {
        background: white;
        padding: 10px 15px;
        border-radius: 30px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        margin-bottom: 15px;
        display: flex;
        gap: 8px;
        align-items: center;
        width: 100%;
        max-width: 500px;
        box-sizing: border-box;
    }

    input {
        padding: 8px 12px;
        border: 2px solid #a5d6a7;
        border-radius: 25px;
        font-size: 13px;
        outline: none;
    }

    #nameInput { width: 60px; text-align: center; flex-shrink: 0; }
    #textInput { flex-grow: 1; min-width: 100px; }

    button {
        padding: 8px 16px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        flex-shrink: 0;
    }

    #growth-msg {
        font-size: 14px;
        font-weight: bold;
        color: #2e7d32;
        background: rgba(255,255,255,0.8);
        padding: 5px 15px;
        border-radius: 20px;
        margin-bottom: 15px;
        text-align: center;
    }

    /* [핵심 수정] 나무 박스 크기를 비율(vw)로 설정하여 화면에 맞게 늘어나고 줄어듦 */
    #tree-box {
        width: 100%;
        max-width: 500px; /* PC 최대 크기 제한 */
        aspect-ratio: 1 / 1; /* 가로세로 1:1 비율 유지 */
        background: white;
        border-radius: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        position: relative;
        overflow: hidden;
        border: 4px solid #ffffff;
        box-sizing: border-box;
    }
    
    #tree-bg-container {
        position: absolute;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1;
    }

    /* 나무 이모지가 화면 크기에 맞춰 동적으로 크기 조절됨 */
    #fallback-tree {
        font-size: 60vw; 
        transition: transform 0.5s ease;
    }
    
    @media (min-width: 550px) {
        #fallback-tree { font-size: 300px; } /* PC 화면 크기 고정 */
    }

    #tree-area {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 2;
    }

    /* 나뭇잎 크기도 화면 비율에 맞춰 동적 조절 */
    .leaf {
        position: absolute;
        font-size: 6vw; 
        transform: translate(-50%, -50%) scale(0);
        animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        user-select: none;
    }

    @media (min-width: 550px) {
        .leaf { font-size: 28px; } /* PC 화면 나뭇잎 크기 고정 */
    }

    @keyframes pop {
        to { transform: translate(-50%, -50%) scale(1); }
    }

    /* 기록 보드 모바일 최적화 */
    #log {
        width: 100%;
        max-width: 500px;
        max-height: 180px;
        margin: 15px 0 30px;
        background: rgba(255, 255, 255, 0.9);
        padding: 15px;
        border-radius: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        overflow-y: auto;
        box-sizing: border-box;
    }

    #log b {
        color: #1b5e20;
        font-size: 14px;
        display: block;
        margin-bottom: 8px;
        border-bottom: 2px solid #c8e6c9;
        padding-bottom: 5px;
    }

    .log-item {
        border-bottom: 1px dashed #e0e0e0;
        padding: 6px 5px;
        font-size: 13px;
    }

    .name {
        font-weight: bold;
        color: #2e7d32;
        background: #e8f5e9;
        padding: 2px 6px;
        border-radius: 10px;
        margin-right: 5px;
    }
</style>
</head>

<body>

<header>
    <h1>🌳 노담나무 🌳</h1>
    <h2>흡연 권유 거절, 노담 실천 문구 작성하기</h2>
</header>

<div class="input-box">
    <input id="nameInput" placeholder="이름" maxlength="5"/>
    <input id="textInput" placeholder="예) 담배는 몸에 나빠!" />
    <button onclick="addEntry()">가꾸기</button>
</div>

<div id="growth-msg">🌱 현재 나무 상태: 아기 씨앗 단계 (잎 0개)</div>

<div id="tree-box">
    <div id="tree-bg-container">
        <span id="fallback-tree">🌳</span>
    </div>
    <div id="tree-area"></div>
</div>

<div id="log">
    <b>📌 우리가 만든 노담 기록장</b>
    <div id="log-list"></div>
</div>

<!-- 파이어베이스 라이브러리 엔진 -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyALLfaAws-3eXrnb_gBv9ynEZBuJMc6AGg",
  authDomain: "tree-8c864.firebaseapp.com",
  projectId: "tree-8c864",
  storageBucket: "tree-8c864.firebasestorage.app",
  messagingSenderId: "434728258229",
  appId: "1:434728258229:web:ac4d19f209c21d25a6ccfc",
  measurementId: "G-D0KRL6KJ06"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore(); 

const treeArea = document.getElementById("tree-area");
const logList = document.getElementById("log-list");
const fallbackTree = document.getElementById("fallback-tree");
const growthMsg = document.getElementById("growth-msg");
const treeBox = document.getElementById("tree-box");

let leafCount = 0; 

function updateTreeGrowth() {
    let scale = 1.0;
    let statusText = "";

    if (leafCount === 0) { scale = 0.8; statusText = "🌱 아기 씨앗 단계 (잎 0개)"; }
    else if (leafCount <= 3) { scale = 0.9; statusText = "🌿 새싹 단계 (첫 걸음마!)"; }
    else if (leafCount <= 7) { scale = 1.0; statusText = "🌳 성장기 단계 (나무가 자라나요)"; }
    else if (leafCount <= 12) { scale = 1.12; statusText = "🌿 풍성 단계 (초록 잎이 가득!)"; }
    else if (leafCount <= 18) { scale = 1.22; statusText = "🌸 꽃길 단계 (꽃이 활짝 피어납니다)"; }
    else { scale = 1.30; statusText = "👑 울창한 노담 숲 단계 (최고의 노담 나무 탄생!)"; }

    fallbackTree.style.transform = `scale(${scale})`;
    growthMsg.innerText = `✨ 현재 나무 상태: ${statusText}`;
}

updateTreeGrowth();

// [수정] 화면 크기가 줄어들면 나뭇잎들의 간격 비율도 화면 크기에 맞추어 유연하게 줄여줌 (모바일 튕김 해결)
function getSpiralPosition(index) {
    const width = treeBox.clientWidth;
    const height = treeBox.clientHeight;
    
    const centerX = width / 2;
    const centerY = height * 0.4; // 나무 머리 부분 세로 비율 조절
    
    const angle = index * 2.39996; 
    
    // 화면 크기(width)가 작아지면 나뭇잎들이 오밀조밀하게 모이도록 계수 처리
    const dynamicGap = 22 * (width / 500); 
    const radius = dynamicGap * Math.sqrt(index + 1); 

    const x = centerX + Math.cos(angle) * radius * 1.3;
    const y = centerY + Math.sin(angle) * radius * 0.9;

    return { x: Math.round(x), y: Math.round(y) };
}

function addEntry() {
    const nameInput = document.getElementById("nameInput");
    const textInput = document.getElementById("textInput");
    const name = nameInput.value.trim();
    const text = textInput.value.trim();

    if (!name || !text) {
        alert("이름과 노담 문장을 모두 입력해주세요! 😊");
        return;
    }

    const items = ["🍃", "🌸", "🌿", "🍀", "🌼", "🌱"];
    const randomLeaf = items[Math.floor(Math.random() * items.length)];

    db.collection("nodamTree").add({
        studentName: name,
        nodamText: text,
        leafType: randomLeaf,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    })
    .then(() => {
        textInput.value = "";
        textInput.focus();
    })
    .catch((error) => { console.error("데이터 저장 실패: ", error); });
}

// 실시간 동기화
db.collection("nodamTree")
    .orderBy("timestamp", "asc")
    .onSnapshot((snapshot) => {
        treeArea.innerHTML = "";
        logList.innerHTML = "";
        leafCount = 0;            

        snapshot.forEach((doc) => {
            const data = doc.data();
            const name = data.studentName;
            const text = data.nodamText;
            const leafType = data.leafType || "🍃";

            const item = document.createElement("div");
            item.className = "log-item";
            item.innerHTML = `<span class="name">${name}</span> ${text}`;
            logList.insertBefore(item, logList.firstChild);

            // 유연해진 가변 나선형 좌표 적용
            const pos = getSpiralPosition(leafCount);

            const leaf = document.createElement("div");
            leaf.className = "leaf";
            leaf.innerText = leafType;
            leaf.style.left = pos.x + "px";
            leaf.style.top = pos.y + "px";

            treeArea.appendChild(leaf);
            leafCount++;
        });
        updateTreeGrowth();
    });

document.getElementById("textInput").addEventListener("keyup", function(event) {
    if (event.key === "Enter") { addEntry(); }
});

// 화면 크기가 변할 때(회전 등) 나뭇잎 위치 재정렬
window.addEventListener('resize', () => {
    // 파이어베이스 가동 중이므로 새로고침 없이 강제 렌더링을 유도하기 위해 데이터를 한 번 더 불러옴
    // (기본적으로 아이들이 한 번 새로고침하거나 글을 하나 쓰면 알아서 완벽하게 재정렬됩니다!)
});
</script>
</body>
</html>
