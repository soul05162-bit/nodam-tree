<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>노담나무</title>

<style>
body{
    text-align:center;
    background:#eef9ee;
    font-family:Arial;
}

#treeArea{
    position:relative;
    width:500px;
    height:600px;
    margin:auto;
    border:1px solid #ddd;
    background:white;
    overflow:hidden;
}

#trunk{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    font-size:160px;
}

/* 🍃 */
.leaf{
    position:absolute;
    font-size:26px;
    transition:0.3s;
}

/* 📋 */
#log{
    width:500px;
    margin:auto;
    text-align:left;
    background:white;
    padding:10px;
    margin-top:10px;
}
</style>
</head>

<body>

<h1>🌳 노담나무 🌳</h1>

<input id="name" placeholder="이름">
<input id="text" placeholder="노담 다짐">
<button onclick="addLeaf()">등록</button>

<div id="treeArea">
    <div id="trunk">🌳</div>
</div>

<h3>📋 기록</h3>
<div id="log"></div>

<script>

const usedPositions = [];

/* 🌳 충돌 없는 위치 생성 */
function getSafePosition(){

    const baseX = 250;
    const baseY = 550;

    for(let i=0;i<100;i++){

        const x = baseX + (Math.random()*200 - 100);
        const y = baseY - (Math.random()*400);

        let ok = true;

        for(const p of usedPositions){
            const dx = p.x - x;
            const dy = p.y - y;

            if(Math.sqrt(dx*dx + dy*dy) < 30){
                ok = false;
                break;
            }
        }

        if(ok){
            usedPositions.push({x,y});
            return {x,y};
        }
    }

    // fallback
    return {x:baseX, y:baseY};
}

function addLeaf(){

    const name = document.getElementById("name").value;
    const text = document.getElementById("text").value;

    if(name === "" || text === "") return;

    const pos = getSafePosition();

    const leaf = document.createElement("div");
    leaf.className = "leaf";

    leaf.innerHTML = Math.random()>0.5 ? "🍃" : "🌸";

    leaf.style.left = pos.x + "px";
    leaf.style.top = pos.y + "px";

    leaf.title = name + " : " + text;

    document.getElementById("treeArea").appendChild(leaf);

    /* 📋 기록 */
    document.getElementById("log").innerHTML +=
        `🌱 <b>${name}</b> : ${text}<br>`;

    document.getElementById("text").value = "";
}

</script>

</body>
</html>
