<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노담나무 만들기</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Malgun Gothic', sans-serif;
        /* 푸릇푸릇하고 싱그러운 자연 느낌의 배경 그라데이션 */
        background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    header {
        text-align: center;
        padding: 25px 10px 15px;
    }

    h1 {
        margin: 0 0 8px 0;
        font-size: 36px;
        color: #1b5e20;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: #43a047;
    }

    /* 입력 상자 스타일 업그레이드 */
    .input-box {
        background: white;
        padding: 15px 25px;
        border-radius: 50px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
        align-items: center;
    }

    input {
        padding: 10px 15px;
        border: 2px solid #a5d6a7;
        border-radius: 25px;
        font-size: 14px;
        outline: none;
        transition: 0.3s;
    }

    input:focus {
        border-color: #4caf50;
    }

    #nameInput { width: 90px; text-align: center; }
    #textInput { width: 25px; flex-grow: 1; min-width: 220px; }

    button {
        padding: 10px 22px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #2e7d32;
        transform: scale(1.05);
    }

    /* 성장 안내 메시지 */
    #growth-msg {
        font-size: 16px;
        font-weight: bold;
        color: #2e7d32;
        background: rgba(255,255,255,0.8);
        padding: 5px 15px;
        border-radius: 20px;
        margin-bottom: 15px;
    }

    /* 메인 카드 */
    #tree-box {
        width: 600px;
        height: 600px;
        background: white;
        border-radius: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        position: relative;
        overflow: hidden;
        border: 4px solid #ffffff;
    }

    /* 나무 줄기 및 기본 틀 배경 (움직이지 않음) */
    .tree-base {
        position: absolute;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        pointer-events: none;
    }
    
    /* 실제 자라나는 초록색 나무 부분 */
    #dynamic-tree {
        position: absolute;
        left: 50%;
        top: 48%;
        transform: translate(-50%, -50%) scale(1.0); /* 기본 크기 */
        font-size: 340px;
        line-height: 1;
        pointer-events: none;
        transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        user-select: none;
        z-index: 1;
    }

    /* 잎과 꽃이 생성되는 레이어 */
    #tree-area {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 2;
    }

    /* 잎/꽃 스타일 및 애니메이션 */
    .leaf {
        position: absolute;
        font-size: 30px;
        transform: translate(-50%, -50%) scale(0);
        animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        user-select: none;
    }

    @keyframes pop {
        to { transform: translate(-50%, -50%) scale(1); }
    }

    /* 하단 기록 보드 */
    #log {
        width: 600px;
        max-height: 200px;
        margin: 25px 0 40px;
        background: rgba(255, 255, 255, 0.9);
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        overflow-y: auto;
        box-sizing: border-box;
    }

    #log b {
        color: #1b5e20;
        font-size: 16px;
        display: block;
        margin-bottom: 10px;
        border-bottom: 2px solid #c8e6c9;
        padding-bottom: 5px;
    }

    .log-item {
        border-bottom: 1px dashed #e0e0e0;
        padding: 8px 5px;
        font-size: 14px;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-50%); }
        to { opacity: 1; transform: translateY(0); }
    }

    .name {
        font-weight: bold;
        color: #2e7d32;
        background: #e8f5e9;
        padding: 2px 8px;
        border-radius: 10px;
        margin-right: 5px;
    }
</style>
</head>

<body>

<header>
    <h1>🌳 노담나무 🌳</h1>
    <h2>흡연 권유 거절, 노담 실천 문구 작성하기</h2>
</header>

<div class="input-box">
    <input id="nameInput" placeholder="이름" maxlength="5"/>
    <input id="textInput" placeholder="예) 담배는 우리 몸을 아프게 해! 안 피울 거야!" />
    <button onclick="addEntry()">나무 가꾸기</button>
</div>

<div id="growth-msg">🌱 현재 나무 상태: 아기 씨앗 단계 (잎 0개)</div>

<div id="tree-box">
    <div id="dynamic-tree">🌳</div>
    <div id="tree-area"></div>
</div>

<div id="log">
    <b>📌 우리가 만든 노담 기록장</b>
    <div id="log-list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
// [연결 완료] 선생님의 진짜 파이어베이스 설정값을 연동했습니다!
const firebaseConfig = {
  apiKey: "AIzaSyALLfaAws-3eXrnb_gBv9ynEZBuJMc6AGg",
  authDomain: "tree-8c864.firebaseapp.com",
  projectId: "tree-8c864",
  storageBucket: "tree-8c864.firebasestorage.app",
  messagingSenderId: "434728258229",
  appId: "1:434728258229:web:ac4d19f209c21d25a6ccfc",
  measurementId: "G-D0KRL6KJ06"
};

// 파이어베이스 시스템 가동
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore(); 

const treeArea = document.getElementById("tree-area");
const logList = document.getElementById("log-list");
const dynamicTree = document.getElementById("dynamic-tree");
const growthMsg = document.getElementById("growth-msg");

const usedPositions = []; 
let leafCount = 0; 

// 나무가 자라는 성장 단계 설정
function updateTreeGrowth() {
    let scale = 1.0;
    let statusText = "";

    if (leafCount === 0) {
        scale = 0.8;
        statusText = "🌱 아기 씨앗 단계 (잎 0개)";
    } else if (leafCount > 0 && leafCount <= 3) {
        scale = 0.9;
        statusText = "🌿 새싹 단계 (첫 걸음마!)";
    } else if (leafCount > 3 && leafCount <= 7) {
        scale = 1.0;
        statusText = "🌳 성장기 단계 (나무가 자라나요)";
    } else if (leafCount > 7 && leafCount <= 12) {
        scale = 1.15;
        statusText = "🌿 풍성 단계 (초록 잎이 가득!)";
    } else if (leafCount > 12 && leafCount <= 18) {
        scale = 1.25;
        statusText = "🌸 꽃길 단계 (꽃이 활짝 피어납니다)";
    } else {
        scale = 1.35;
        statusText = "👑 울창한 노담 숲 단계 (최고의 노담 나무 탄생!)";
    }

    dynamicTree.style.transform = `translate(-50%, -50%) scale(${scale})`;
    growthMsg.innerText = `✨ 현재 나무 상태: ${statusText}`;
}

// 최초 1회 실행하여 초기 크기 조절
updateTreeGrowth();

// 나무 이모지 타원 영역 내부에서만 좌표를 추출하는 함수
function getTreePosition() {
    const centerX = 300; 
    const centerY = 240; 
    let currentScale = parseFloat(dynamicTree.style.transform.split('scale(')[1]) || 1.0;
    
    const rx = 130 * currentScale; 
    const ry = 110 * currentScale; 

    for (let i = 0; i < 300; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.sqrt(Math.random()); 

        const x = centerX + Math.cos(angle) * rx * radius;
        const y = centerY + Math.sin(angle) * ry * radius;

        let overlap = false;
        for (const p of usedPositions) {
            const dx = p.x - x;
            const dy = p.y - y;
            if (Math.sqrt(dx * dx + dy * dy) < 22) { 
                overlap = true;
                break;
            }
        }

        if (!overlap) {
            usedPositions.push({ x, y });
            return { x, y };
        }
    }

    return { 
        x: centerX + (Math.random() * 160 - 80), 
        y: centerY + (Math.random() * 120 - 60) 
    };
}

// [파이어베이스용 연동] 입력창의 데이터를 실시간으로 파이어베이스 DB에 저장
function addEntry() {
    const nameInput = document.getElementById("nameInput");
    const textInput = document.getElementById("textInput");
    
    const name = nameInput.value.trim();
    const text = textInput.value.trim();

    if (!name || !text) {
        alert("이름과 노담 문장을 모두 입력해주세요! 😊");
        return;
    }

    // 파이어베이스의 'nodamTree'라는 이름의 컬렉션(저장소)에 보관합니다.
    db.collection("nodamTree").add({
        studentName: name,
        nodamText: text,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    })
    .then(() => {
        // 성공 시 입력창 비우기
        textInput.value = "";
        textInput.focus();
    })
    .catch((error) => {
        console.error("데이터 저장 실패: ", error);
    });
}

// [파이어베이스용 연동] 실시간으로 DB를 감시하여 화면에 잎을 그리고 나무를 키우는 핵심 기능
db.collection("nodamTree")
    .orderBy("timestamp", "asc")
    .onSnapshot((snapshot) => {
        // 새 글이 들어올 때마다 화면을 한 번 리셋하고 처음부터 다시 그림으로써 겹침과 오작동을 원천 봉쇄합니다.
        treeArea.innerHTML = "";
        logList.innerHTML = "";
        usedPositions.length = 0; 
        leafCount = 0;            

        snapshot.forEach((doc) => {
            const data = doc.data();
            const name = data.studentName;
            const text = data.nodamText;

            // 1. 하단 리스트에 기록 추가
            const item = document.createElement("div");
            item.className = "log-item";
            item.innerHTML = `<span class="name">${name}</span> ${text}`;
            logList.insertBefore(item, logList.firstChild);

            // 2. 나무 위에 잎/꽃 생성
            const leaf = document.createElement("div");
            leaf.className = "leaf";
            
            const items = ["🍃", "🌸", "🌿", "🍀", "🌼", "🌱"];
            // 아이들이 적은 텍스트의 길이를 이용하여 나뭇잎 이모지가 새로고침할 때마다 바뀌지 않고 고정되도록 처리
            const itemIndex = (name.length + text.length) % items.length;
            leaf.innerText = items[itemIndex];

            const pos = getTreePosition();
            leaf.style.left = pos.x + "px";
            leaf.style.top = pos.y + "px";

            treeArea.appendChild(leaf);

            leafCount++;
        });

        // 잎이 모두 생성된 후 전체적인 나무 성장 상태 업데이트
        updateTreeGrowth();
    });

// 엔터키 입력 지원
document.getElementById("textInput").addEventListener("keyup", function(event) {
    if (event.key === "Enter") {
        addEntry();
    }
});
</script>

</body>
</html>
