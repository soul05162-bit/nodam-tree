<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>노담나무 만들기</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(#d7f3ff, #ffffff);
    }

    header {
        text-align: center;
        padding: 18px;
    }

    h1 {
        margin: 10px 0 5px;
        font-size: 34px;
        color: #2e7d32;
    }

    h2 {
        margin: 0;
        font-weight: normal;
        color: #4f7c5a;
    }

    .input-box {
        text-align: center;
        margin: 15px;
    }

    input {
        width: 180px;
        padding: 10px;
        margin: 4px;
    }

    button {
        padding: 10px 14px;
        background: #2e7d32;
        color: white;
        border: none;
        cursor: pointer;
    }

    button:hover {
        background: #1b5e20;
    }

    /* 🟦 흰 카드 */
    #tree-box {
        width: 600px;
        height: 750px;
        margin: 0 auto;
        background: white;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        position: relative;
        overflow: hidden;
    }

    #tree-area {
        position: relative;
        width: 100%;
        height: 100%;
    }

    /* 🌳 큰 중심 나무 */
    .big-tree {
        position: absolute;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 420px; /* 🔥 핵심: 크게 */
        opacity: 0.95;
        user-select: none;
        pointer-events: none;
    }

    /* 🌸 잎/꽃 */
    .leaf {
        position: absolute;
        font-size: 28px; /* 🔥 조금 더 큼 */
        animation: pop 0.25s ease;
    }

    @keyframes pop {
        from { transform: scale(0); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    /* 기록 */
    #log {
        width: 80%;
        max-width: 750px;
        margin: 20px auto;
        background: rgba(255,255,255,0.9);
        padding: 10px;
        border-radius: 10px;
    }

    .log-item {
        border-bottom: 1px solid #ddd;
        padding: 6px;
        font-size: 14px;
    }

    .name {
        font-weight: bold;
        color: #2e7d32;
    }
</style>
</head>

<body>

<header>
    <h1>🌳 노담나무 🌳</h1>
    <h2>흡연 권유 거절, 노담 실천 문구 작성하기</h2>
</header>

<div class="input-box">
    <input id="nameInput" placeholder="학생 이름" />
    <input id="textInput" placeholder="문장 입력" />
    <button onclick="addEntry()">추가</button>
</div>

<!-- 🟦 카드 안에 모든 구조 -->
<div id="tree-box">
    <div id="tree-area">

        <!-- 🌳 중심 큰 나무 -->
        <div class="big-tree">🌳</div>

    </div>
</div>

<div id="log">
    <b>📌 작성 기록</b>
</div>

<script>
const treeArea = document.getElementById("tree-area");
const log = document.getElementById("log");

const usedPositions = [];

function getPosition() {
    let x, y;

    for (let i = 0; i < 60; i++) {
        x = Math.random() * 420 + 80;  // 카드 안 전체 영역
        y = Math.random() * 520 + 100;

        let ok = true;

        for (let p of usedPositions) {
            const dx = p.x - x;
            const dy = p.y - y;
            if (Math.sqrt(dx*dx + dy*dy) < 35) {
                ok = false;
                break;
            }
        }

        if (ok) {
            usedPositions.push({x, y});
            return {x, y};
        }
    }

    return {x, y};
}

function addEntry() {
    const name = document.getElementById("nameInput").value.trim();
    const text = document.getElementById("textInput").value.trim();

    if (!name || !text) return;

    // 기록
    const item = document.createElement("div");
    item.className = "log-item";
    item.innerHTML = `<span class="name">${name}</span> : ${text}`;
    log.appendChild(item);

    // 🌸 더 많이 나오게
    const leaf = document.createElement("div");
    leaf.className = "leaf";

    leaf.innerText = Math.random() < 0.75 ? "🌸" : "🍃";

    const pos = getPosition();
    leaf.style.left = pos.x + "px";
    leaf.style.top = pos.y + "px";

    treeArea.appendChild(leaf);
}
</script>

</body>
</html>
