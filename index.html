<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>노담나무 만들기</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(#bfe9ff, #e8f7ff 60%, #ffffff);
        overflow-x: hidden;
    }

    header {
        text-align: center;
        padding: 20px;
    }

    h1 {
        margin: 10px 0 5px;
        font-size: 32px;
        color: #2b5d34;
    }

    h2 {
        margin: 0;
        font-weight: normal;
        color: #4a7c59;
    }

    .container {
        display: flex;
        justify-content: center;
        margin-top: 20px;
        position: relative;
    }

    /* 나무 영역 */
    #tree-area {
        position: relative;
        width: 500px;
        height: 650px;
    }

    /* 입력 영역 */
    .input-box {
        text-align: center;
        margin-top: 20px;
    }

    input {
        width: 300px;
        padding: 10px;
        font-size: 14px;
    }

    button {
        padding: 10px 15px;
        background: #2e7d32;
        color: white;
        border: none;
        cursor: pointer;
    }

    button:hover {
        background: #1b5e20;
    }

    /* 생성된 잎 */
    .leaf {
        position: absolute;
        font-size: 18px;
        user-select: none;
        pointer-events: none;
        animation: pop 0.4s ease;
    }

    @keyframes pop {
        from { transform: scale(0); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    /* 기록 */
    #log {
        margin: 20px auto;
        width: 80%;
        max-width: 700px;
        background: rgba(255,255,255,0.8);
        padding: 10px;
        border-radius: 10px;
    }

    .log-item {
        border-bottom: 1px solid #ddd;
        padding: 5px;
        font-size: 14px;
    }
</style>
</head>

<body>

<header>
    <h1>🌳 노담나무 만들기</h1>
    <h2>흡연 권유 거절, 노담 실천 문구 작성하기</h2>
</header>

<div class="input-box">
    <input id="textInput" placeholder="문장을 입력하세요 (예: 담배 안 피울래요!)" />
    <button onclick="addText()">추가</button>
</div>

<div class="container">
    <div id="tree-area">

        <!-- 나무 (SVG) -->
        <svg width="500" height="650">
            <!-- 줄기 -->
            <rect x="230" y="350" width="40" height="250" fill="#6d4c41"/>
            
            <!-- 나무 잎 덩어리 -->
            <circle cx="250" cy="250" r="120" fill="#2e7d32"/>
            <circle cx="180" cy="300" r="90" fill="#388e3c"/>
            <circle cx="320" cy="300" r="90" fill="#388e3c"/>
            <circle cx="250" cy="180" r="90" fill="#43a047"/>
        </svg>

    </div>
</div>

<div id="log">
    <b>작성 기록</b>
</div>

<script>
const treeArea = document.getElementById("tree-area");
const log = document.getElementById("log");

function addText() {
    const input = document.getElementById("textInput");
    const text = input.value.trim();
    if (!text) return;

    // 기록 추가
    const div = document.createElement("div");
    div.className = "log-item";
    div.innerText = text;
    log.appendChild(div);

    // 나무 안 랜덤 위치 (대략 잎 영역)
    const area = treeArea.getBoundingClientRect();

    const x = Math.random() * 300 + 100;  // 나무 중심 영역
    const y = Math.random() * 300 + 120;

    const span = document.createElement("div");
    span.className = "leaf";

    // 종류 랜덤 (잎 / 꽃 / 단풍)
    const items = ["🍃", "🌸", "🍁"];
    span.innerText = items[Math.floor(Math.random() * items.length)];

    span.style.left = x + "px";
    span.style.top = y + "px";

    treeArea.appendChild(span);

    input.value = "";
}
</script>

</body>
</html>
