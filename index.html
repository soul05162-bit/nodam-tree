<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>노담나무 캠페인</title>

<style>
body{
    text-align:center;
    background:#eef9ee;
    font-family:Arial;
}

h1{
    color:#2e7d32;
}

.container{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
}

/* 🌳 공통 나무 영역 */
.treeBox{
    width:450px;
    height:600px;
    border:1px solid #ddd;
    background:white;
    position:relative;
    overflow:hidden;
}

.title{
    font-weight:bold;
    margin:10px 0;
}

/* 🌳 줄기 */
.trunk{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    font-size:150px;
}

/* 🍃 잎 */
.leaf{
    position:absolute;
    font-size:24px;
}

/* 📋 기록 */
.log{
    width:450px;
    text-align:left;
    margin:auto;
    background:white;
    padding:10px;
    margin-top:10px;
    height:150px;
    overflow:auto;
}
</style>
</head>

<body>

<h1>🌳 노담 캠페인 🌳</h1>

<input id="name" placeholder="이름">
<input id="text" placeholder="문구 입력">
<select id="type">
    <option value="nodam">노담 실천 🌳</option>
    <option value="refuse">흡연 권유 거절 🚫</option>
</select>

<button onclick="addLeaf()">등록</button>

<div class="container">

    <!-- 🌳 1번 나무 -->
    <div>
        <div class="title">🌳 노담 실천 문구</div>
        <div class="treeBox" id="tree1">
            <div class="trunk">🌳</div>
        </div>
        <div class="log" id="log1"></div>
    </div>

    <!-- 🌳 2번 나무 -->
    <div>
        <div class="title">🚫 흡연 권유 거절 문구</div>
        <div class="treeBox" id="tree2">
            <div class="trunk">🌳</div>
        </div>
        <div class="log" id="log2"></div>
    </div>

</div>

<script>

let count1 = 0;
let count2 = 0;

/* 🌳 위치 생성 */
function getPos(count){

    const baseX = 220;
    const baseY = 550;

    return {
        x: baseX + (Math.random()*120 - 60),
        y: baseY - (count * 20)
    };
}

function addLeaf(){

    const name = document.getElementById("name").value;
    const text = document.getElementById("text").value;
    const type = document.getElementById("type").value;

    if(name === "" || text === "") return;

    const leaf = document.createElement("div");
    leaf.className = "leaf";
    leaf.innerHTML = Math.random()>0.5 ? "🍃" : "🌸";

    if(type === "nodam"){

        count1++;

        const pos = getPos(count1);

        leaf.style.left = pos.x + "px";
        leaf.style.top = pos.y + "px";

        document.getElementById("tree1").appendChild(leaf);

        document.getElementById("log1").innerHTML +=
            `🌱 <b>${name}</b> : ${text}<br>`;
    }

    else{

        count2++;

        const pos = getPos(count2);

        leaf.style.left = pos.x + "px";
        leaf.style.top = pos.y + "px";

        document.getElementById("tree2").appendChild(leaf);

        document.getElementById("log2").innerHTML +=
            `🚫 <b>${name}</b> : ${text}<br>`;
    }

    document.getElementById("text").value = "";
}

</script>

</body>
</html>
