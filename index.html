<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>노담나무</title>

<style>
body{
    text-align:center;
    background:#eef9ee;
    font-family:Arial;
}

h1{
    color:#2e7d32;
}

#treeArea{
    position:relative;
    width:500px;
    height:500px;
    margin:auto;
    overflow:hidden;
}

/* 🌳 나무 줄기 */
#trunk{
    font-size:180px;
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%) scale(1);
    transition:1s;
}

/* 🍃 잎/꽃 */
.leaf{
    position:absolute;
    font-size:26px;
    transition:0.4s;
}

.leaf:hover{
    transform:scale(1.5) rotate(10deg);
}

input, button{
    padding:10px;
    margin:5px;
}
</style>
</head>

<body>

<h1>🌳 노담나무 🌳</h1>

<input id="name" placeholder="이름">
<input id="text" placeholder="노담 다짐">
<button onclick="addLeaf()">등록</button>

<div id="treeArea">
    <div id="trunk">🌳</div>
</div>

<script>

let growth = 0;

// 🌳 가지 위치 (위로 갈수록 작게 퍼짐)
const branches = [
  {x:240,y:200},
  {x:200,y:180},
  {x:280,y:180},
  {x:170,y:150},
  {x:300,y:150},
  {x:220,y:120},
  {x:260,y:120},
  {x:190,y:90},
  {x:290,y:90},
  {x:230,y:60}
];

function addLeaf(){

    const name = document.getElementById("name").value;
    const text = document.getElementById("text").value;

    if(name === "" || text === "") return;

    if(growth >= branches.length){
        alert("🌳 나무가 충분히 성장했어요!");
        return;
    }

    // 🌳 성장 증가
    growth++;

    // 🌳 나무 커짐
    const trunk = document.getElementById("trunk");
    trunk.style.transform =
        `translateX(-50%) scale(${1 + growth * 0.1})`;

    // 🍃 잎 생성
    const leaf = document.createElement("div");
    leaf.className = "leaf";

    leaf.innerHTML = Math.random() > 0.5 ? "🍃" : "🌸";

    leaf.style.left = branches[growth-1].x + "px";
    leaf.style.top = branches[growth-1].y + "px";

    leaf.title = name + " : " + text;

    // 클릭 효과
    leaf.onclick = () => {
        leaf.style.transform = "scale(1.6) rotate(15deg)";
        setTimeout(()=>leaf.style.transform="",300);
    };

    document.getElementById("treeArea").appendChild(leaf);

}

</script>

</body>
</html>
