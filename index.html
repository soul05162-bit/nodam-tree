<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>🌳노담나무🌳</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to top, #d7fbe8, #f0fff4, #ffffff);
    overflow: hidden;
}

/* 제목 */
h1 {
    text-align: center;
    margin-top: 15px;
    color: #22543d;
}

h3 {
    text-align: center;
    margin-top: -10px;
    color: #2f855a;
    font-weight: normal;
}

/* 전체 영역 */
#container {
    position: relative;
    width: 100vw;
    height: 90vh;
}

/* 🌳 나무 (배경 이미지 핵심) */
#tree {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 500px;
    height: 650px;

    background-image: url("https://i.imgur.com/3ZQ3Z9M.png");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: bottom;
}

/* 잎/꽃/단풍 */
.item {
    position: absolute;
    font-size: 28px;
    transform: translate(-50%, -50%);
    animation: pop 0.3s ease;
    pointer-events: none;
}

@keyframes pop {
    from { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

/* 버튼 */
#btn {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 10px 15px;
    border: none;
    background: #38a169;
    color: white;
    border-radius: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>🌳노담나무🌳</h1>
<h3>흡연 권유 거절 문구</h3>

<div id="container">
    <div id="tree"></div>
    <button id="btn">하나 추가 🌱</button>
</div>

<script>
const tree = document.getElementById("tree");
const btn = document.getElementById("btn");

let index = 0;
const items = ["🍃", "🌸", "🍁"];

function addItem() {
    const item = document.createElement("div");
    item.className = "item";
    item.innerText = items[index];

    const rect = tree.getBoundingClientRect();

    // 🌳 핵심: 나무 "안쪽 영역"만 좌표 생성
    const x = rect.left + rect.width * (0.25 + Math.random() * 0.5);
    const y = rect.top + rect.height * (0.15 + Math.random() * 0.6);

    item.style.left = x + "px";
    item.style.top = y + "px";

    document.body.appendChild(item);

    index = (index + 1) % items.length;
}

btn.addEventListener("click", addItem);
</script>

</body>
</html
