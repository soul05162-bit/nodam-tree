<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>노담나무</title>

<style>
body{
    text-align:center;
    background:#eef9ee;
}

#treeArea{
    position:relative;
    width:500px;
    height:500px;
    margin:auto;
}

#tree{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:250px;
}

.leaf{
    position:absolute;
    font-size:28px;
    cursor:pointer;
    transition:0.3s;
}

.leaf:hover{
    transform:scale(1.4) rotate(10deg);
}
</style>
</head>

<body>

<h1>🌳 노담나무 🌳</h1>

<input id="text" placeholder="노담 다짐 입력">
<input id="name" placeholder="이름">
<button onclick="addData()">등록</button>

<div id="treeArea">
    <img id="tree" src="tree1.png">
</div>

<script type="module">

// ===== Firebase =====
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ===== 가지 위치 =====
const points = [
 {x:240,y:180},{x:200,y:160},{x:280,y:160},
 {x:170,y:130},{x:300,y:130},{x:220,y:100},
 {x:260,y:100},{x:190,y:80},{x:290,y:80},
 {x:230,y:60}
];

let index = 0;

// ===== 데이터 추가 =====
window.addData = async function(){

    const text = document.getElementById("text").value;
    const name = document.getElementById("name").value;

    await addDoc(collection(db,"leaves"),{
        text,
        name,
        type: Math.random()>0.5?"🍃":"🌸"
    });

    document.getElementById("text").value="";
