<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>노담나무</title>

<style>
body{
    text-align:center;
    background:#eef9ee;
    font-family:Arial;
}

#treeArea{
    position:relative;
    width:500px;
    height:600px;
    margin:auto;
    border:1px solid #ddd;
    background:white;
    overflow:hidden;
}

/* 🌳 줄기 고정 */
#trunk{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    font-size:160px;
}

/* 🍃 잎 */
.leaf{
    position:absolute;
    font-size:26px;
    transition:0.3s;
}

#log{
    width:500px;
    margin:auto;
    text-align:left;
    background:white;
    padding:10px;
    margin-top:10px;
}
</style>
</head>

<body>

<h1>🌳 노담나무 🌳</h1>

<input id="name" placeholder="이름">
<input id="text" placeholder="노담 다짐">
<button onclick="addLeaf()">등록</button>

<div id="treeArea">
    <div id="trunk">🌳</div>
</div>

<h3>📋 기록</h3>
<div id="log"></div>

<script>

let count = 0;

/* 🌳 “성장 영역” (핵심) */
function getGrowArea(){

    const baseX = 250;
    const baseBottom = 500;

    // 🌳 나무가 클수록 위로 영역 확장
    const height = count * 12;

    return {
        xMin: baseX - 80,
        xMax: baseX + 80,
        yMin: baseBottom - height,
        yMax: baseBottom - 20
    };
}

function addLeaf(){

    const name = document.getElementById("name").value;
    const text = document.getElementById("text").value;

    if(name === "" || text === "") return;

    count++;

    const area = getGrowArea();

    /* 🍃 반드시 “현재 나무 영역 안”에서 생성 */
    const x = Math.random() * (area.xMax - area.xMin) + area.xMin;
    const y = Math.random() * (area.yMax - area.yMin) + area.yMin;

    const leaf = document.createElement("div");
    leaf.className = "leaf";

    leaf.innerHTML = Math.random() > 0.5 ? "🍃" : "🌸";

    leaf.style.left = x + "px";
    leaf.style.top = y + "px";

    leaf.title = name + " : " + text;

    document.getElementById("treeArea").appendChild(leaf);

    /* 📋 기록 */
    document.getElementById("log").innerHTML +=
        `🌱 <b>${name}</b> : ${text}<br>`;

    /* 입력 초기화 */
    document.getElementById("text").value = "";
}

</script>

</body>
</html>
