<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>노담나무 만들기</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(#d7f3ff, #ffffff);
    }

    header {
        text-align: center;
        padding: 18px;
    }

    h1 {
        margin: 10px 0 5px;
        font-size: 34px;
        color: #2e7d32;
    }

    h2 {
        margin: 0;
        font-weight: normal;
        color: #4f7c5a;
    }

    .input-box {
        text-align: center;
        margin: 15px;
    }

    input {
        width: 180px;
        padding: 10px;
        margin: 4px;
    }

    button {
        padding: 10px 14px;
        background: #2e7d32;
        color: white;
        border: none;
        cursor: pointer;
    }

    button:hover {
        background: #1b5e20;
    }

    /* 카드 */
    #tree-box {
        width: 600px;
        height: 750px;
        margin: 0 auto;
        background: white;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        position: relative;
        overflow: hidden;
    }

    /* 나무 */
    .tree {
        position: absolute;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    /* 생성 영역 */
    #tree-area {
        position: absolute;
        width: 100%;
        height: 100%;
    }

    /* 잎 */
    .leaf {
        position: absolute;
        font-size: 28px;
        animation: pop 0.2s ease;
    }

    @keyframes pop {
        from { transform: scale(0); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    /* 기록 */
    #log {
        width: 80%;
        max-width: 750px;
        margin: 20px auto;
        background: rgba(255,255,255,0.9);
        padding: 10px;
        border-radius: 10px;
    }

    .log-item {
        border-bottom: 1px solid #ddd;
        padding: 6px;
        font-size: 14px;
    }

    .name {
        font-weight: bold;
        color: #2e7d32;
    }
</style>
</head>

<body>

<header>
    <h1>🌳 노담나무 🌳</h1>
    <h2>흡연 권유 거절, 노담 실천 문구 작성하기</h2>
</header>

<div class="input-box">
    <input id="nameInput" placeholder="학생 이름" />
    <input id="textInput" placeholder="문장 입력" />
    <button onclick="addEntry()">추가</button>
</div>

<div id="tree-box">

    <!-- 나무 그림 -->
    <div class="tree">
        <div style="font-size:420px; text-align:center; margin-top:20px;">🌳</div>
    </div>

    <!-- 생성 영역 -->
    <div id="tree-area"></div>

</div>

<div id="log">
    <b>📌 작성 기록</b>
</div>

<script>
const treeArea = document.getElementById("tree-area");
const log = document.getElementById("log");

const usedPositions = []; // 겹침 방지

function getTreePosition() {

    const centerX = 300;
    const centerY = 300;

    const rx = 180;
    const ry = 220;

    const trunkWidth = 80;

    for (let i = 0; i < 200; i++) {

        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random();

        const x = centerX + Math.cos(angle) * rx * radius;
        const y = centerY + Math.sin(angle) * ry * radius;

        // 나무 영역
        const inTree =
            Math.pow((x - centerX) / rx, 2) +
            Math.pow((y - centerY) / ry, 2) <= 1;

        // 줄기 제외
        const inTrunk =
            x > centerX - trunkWidth / 2 &&
            x < centerX + trunkWidth / 2 &&
            y > centerY + 60;

        if (!inTree || inTrunk) continue;

        // 겹침 체크
        let overlap = false;
        for (const p of usedPositions) {
            const dx = p.x - x;
            const dy = p.y - y;
            if (Math.sqrt(dx * dx + dy * dy) < 18) {
                overlap = true;
                break;
            }
        }

        if (!overlap) {
            usedPositions.push({ x, y });
            return { x, y };
        }
    }

    return { x: centerX, y: centerY - 100 };
}

function addEntry() {
    const name = document.getElementById("nameInput").value.trim();
    const text = document.getElementById("textInput").value.trim();

    if (!name || !text) return;

    // 기록
    const item = document.createElement("div");
    item.className = "log-item";
    item.innerHTML = `<span class="name">${name}</span> : ${text}`;
    log.appendChild(item);

    // 잎/꽃 생성
    const leaf = document.createElement("div");
    leaf.className = "leaf";
    leaf.innerText = Math.random() < 0.7 ? "🌸" : "🍃";

    const pos = getTreePosition();
    leaf.style.left = pos.x + "px";
    leaf.style.top = pos.y + "px";

    treeArea.appendChild(leaf);
}
</script>

</body>
</html>
