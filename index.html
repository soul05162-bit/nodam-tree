<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노담나무 만들기</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Malgun Gothic', sans-serif;
        background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    header {
        text-align: center;
        padding: 25px 10px 15px;
    }

    h1 {
        margin: 0 0 8px 0;
        font-size: 36px;
        color: #1b5e20;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: #43a047;
    }

    .input-box {
        background: white;
        padding: 15px 25px;
        border-radius: 50px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
        align-items: center;
    }

    input {
        padding: 10px 15px;
        border: 2px solid #a5d6a7;
        border-radius: 25px;
        font-size: 14px;
        outline: none;
        transition: 0.3s;
    }

    input:focus {
        border-color: #4caf50;
    }

    #nameInput { width: 90px; text-align: center; }
    #textInput { width: 25px; flex-grow: 1; min-width: 220px; }

    button {
        padding: 10px 22px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #2e7d32;
        transform: scale(1.05);
    }

    #growth-msg {
        font-size: 16px;
        font-weight: bold;
        color: #2e7d32;
        background: rgba(255,255,255,0.8);
        padding: 5px 15px;
        border-radius: 20px;
        margin-bottom: 15px;
    }

    #tree-box {
        width: 600px;
        height: 600px;
        background: white;
        border-radius: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        position: relative;
        overflow: hidden;
        border: 4px solid #ffffff;
    }
    
    #dynamic-tree {
        position: absolute;
        left: 50%;
        top: 48%;
        transform: translate(-50%, -50%) scale(1.0);
        font-size: 340px;
        line-height: 1;
        pointer-events: none;
        transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        user-select: none;
        z-index: 1;
    }

    #tree-area {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 2;
    }

    .leaf {
        position: absolute;
        font-size: 30px;
        transform: translate(-50%, -50%) scale(0);
        animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        user-select: none;
    }

    @keyframes pop {
        to { transform: translate(-50%, -50%) scale(1); }
    }

    #log {
        width: 600px;
        max-height: 200px;
        margin: 25px 0 40px;
        background: rgba(255, 255, 255, 0.9);
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        overflow-y: auto;
        box-sizing: border-box;
    }

    #log b {
        color: #1b5e20;
        font-size: 16px;
        display: block;
        margin-bottom: 10px;
        border-bottom: 2px solid #c8e6c9;
        padding-bottom: 5px;
    }

    .log-item {
        border-bottom: 1px dashed #e0e0e0;
        padding: 8px 5px;
        font-size: 14px;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-50%); }
        to { opacity: 1; transform: translateY(0); }
    }

    .name {
        font-weight: bold;
        color: #2e7d32;
        background: #e8f5e9;
        padding: 2px 8px;
        border-radius: 10px;
        margin-right: 5px;
    }
</style>
</head>

<body>

<header>
    <h1>🌳 노담나무 🌳</h1>
    <h2>흡연 권유 거절, 노담 실천 문구 작성하기</h2>
</header>

<div class="input-box">
    <input id="nameInput" placeholder="이름" maxlength="5"/>
    <input id="textInput" placeholder="예) 담배는 우리 몸을 아프게 해! 안 피울 거야!" />
    <button onclick="addEntry()">나무 가꾸기</button>
</div>

<div id="growth-msg">🌱 현재 나무 상태: 아기 씨앗 단계 (잎 0개)</div>

<div id="tree-box">
    <div id="dynamic-tree">🌳</div>
    <div id="tree-area"></div>
</div>

<div id="log">
    <b>📌 우리가 만든 노담 기록장</b>
    <div id="log-list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
// 선생님의 실제 파이어베이스 설정값 유지
const firebaseConfig = {
  apiKey: "AIzaSyALLfaAws-3eXrnb_gBv9ynEZBuJMc6AGg",
  authDomain: "tree-8c864.firebaseapp.com",
  projectId: "tree-8c864",
  storageBucket: "tree-8c864.firebasestorage.app",
  messagingSenderId: "434728258229",
  appId: "1:434728258229:web:ac4d19f209c21d25a6ccfc",
  measurementId: "G-D0KRL6KJ06"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore(); 

const treeArea = document.getElementById("tree-area");
const logList = document.getElementById("log-list");
const dynamicTree = document.getElementById("dynamic-tree");
const growthMsg = document.getElementById("growth-msg");

let leafCount = 0; 

// 나무가 자라는 성장 단계 설정
function updateTreeGrowth() {
    let scale = 1.0;
    let statusText = "";

    if (leafCount === 0) { scale = 0.8; statusText = "🌱 아기 씨앗 단계 (잎 0개)"; }
    else if (leafCount <= 3) { scale = 0.9; statusText = "🌿 새싹 단계 (첫 걸음마!)"; }
    else if (leafCount <= 7) { scale = 1.0; statusText = "🌳 성장기 단계 (나무가 자라나요)"; }
    else if (leafCount <= 12) { scale = 1.15; statusText = "🌿 풍성 단계 (초록 잎이 가득!)"; }
    else if (leafCount <= 18) { scale = 1.25; statusText = "🌸 꽃길 단계 (꽃이 활짝 피어납니다)"; }
    else { scale = 1.35; statusText = "👑 울창한 노담 숲 단계 (최고의 노담 나무 탄생!)"; }

    dynamicTree.style.transform = `translate(-50%, -50%) scale(${scale})`;
    growthMsg.innerText = `✨ 현재 나무 상태: ${statusText}`;
}

updateTreeGrowth();

// [수정] 나무 크기 변화와 무관하게 완전히 고정된 풍성한 나뭇잎 구역 좌표 추출 (허공 방지 고정값)
function generateFixedPosition() {
    const centerX = 300; 
    const centerY = 230; // 기준점을 살짝 올려 나무 풍선 정중앙에 맞춤
    const rx = 120; // 가로 반경 고정
    const ry = 100; // 세로 반경 고정

    const angle = Math.random() * Math.PI * 2;
    const radius = Math.sqrt(Math.random()); // 중앙 배치 비율 안정화

    const x = centerX + Math.cos(angle) * rx * radius;
    const y = centerY + Math.sin(angle) * ry * radius;

    return { x: Math.round(x), y: Math.round(y) };
}

// [수정] 글을 쓸 때 나뭇잎 종류와 좌표(X, Y)를 아예 고정해서 DB에 함께 저장합니다.
function addEntry() {
    const nameInput = document.getElementById("nameInput");
    const textInput = document.getElementById("textInput");
    const name = nameInput.value.trim();
    const text = textInput.value.trim();

    if (!name || !text) {
        alert("이름과 노담 문장을 모두 입력해주세요! 😊");
        return;
    }

    const pos = generateFixedPosition();
    const items = ["🍃", "🌸", "🌿", "🍀", "🌼", "🌱"];
    const randomLeaf = items[Math.floor(Math.random() * items.length)];

    db.collection("nodamTree").add({
        studentName: name,
        nodamText: text,
        leafType: randomLeaf,
        posX: pos.x,
        posY: pos.y,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    })
    .then(() => {
        textInput.value = "";
        textInput.focus();
    })
    .catch((error) => { console.error("데이터 저장 실패: ", error); });
}

// [수정] 파이어베이스에서 저장된 좌표를 그대로 읽어와서 그리기 때문에 절대 춤추거나 허공에 뜨지 않습니다!
db.collection("nodamTree")
    .orderBy("timestamp", "asc")
    .onSnapshot((snapshot) => {
        treeArea.innerHTML = "";
        logList.innerHTML = "";
        leafCount = 0;            

        snapshot.forEach((doc) => {
            const data = doc.data();
            const name = data.studentName;
            const text = data.nodamText;
            
            // 만약 예전 테스트 데이터에 좌표가 없으면 실시간 생성
            const leafType = data.leafType || "🍃";
            const posX = data.posX || (300 + (Math.random() * 160 - 80));
            const posY = data.posY || (230 + (Math.random() * 120 - 60));

            // 1. 하단 리스트 추가
            const item = document.createElement("div");
            item.className = "log-item";
            item.innerHTML = `<span class="name">${name}</span> ${text}`;
            logList.insertBefore(item, logList.firstChild);

            // 2. 나무 위에 잎/꽃 고정 생성
            const leaf = document.createElement("div");
            leaf.className = "leaf";
            leaf.innerText = leafType;
            leaf.style.left = posX + "px";
            leaf.style.top = posY + "px";

            treeArea.appendChild(leaf);
            leafCount++;
        });
        updateTreeGrowth();
    });

document.getElementById("textInput").addEventListener("keyup", function(event) {
    if (event.key === "Enter") { addEntry(); }
});
</script>
</body>
</html>
