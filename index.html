<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>노담나무 만들기</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(#cfefff, #f3fbff 60%, #ffffff);
    }

    header {
        text-align: center;
        padding: 18px;
    }

    h1 {
        margin: 10px 0 5px;
        font-size: 34px;
        color: #2e7d32;
    }

    h2 {
        margin: 0;
        font-weight: normal;
        color: #4f7c5a;
    }

    .input-box {
        text-align: center;
        margin: 15px;
    }

    input {
        width: 170px;
        padding: 10px;
        margin: 4px;
    }

    button {
        padding: 10px 14px;
        background: #2e7d32;
        color: white;
        border: none;
        cursor: pointer;
    }

    button:hover {
        background: #1b5e20;
    }

    /* 🌳 나무 영역 */
    #tree-container {
        display: flex;
        justify-content: center;
        margin-top: 10px;
    }

    #tree-area {
        position: relative;
        width: 520px;
        height: 650px;
    }

    /* 🌿 귀여운 나무 디자인 */
    .tree {
        position: absolute;
        left: 110px;
        top: 40px;
        width: 300px;
        height: 520px;
    }

    /* 나무 잎 덩어리 (동글동글) */
    .crown {
        position: absolute;
        top: 0;
        left: 0;
        width: 300px;
        height: 300px;
        background: radial-gradient(circle at 30% 30%, #66bb6a, #2e7d32);
        border-radius: 50%;
        box-shadow: inset -10px -10px 0 rgba(0,0,0,0.1);
    }

    .crown2 {
        position: absolute;
        top: 40px;
        left: -40px;
        width: 200px;
        height: 200px;
        background: #43a047;
        border-radius: 50%;
    }

    .crown3 {
        position: absolute;
        top: 50px;
        left: 140px;
        width: 210px;
        height: 210px;
        background: #4caf50;
        border-radius: 50%;
    }

    /* 줄기 */
    .trunk {
        position: absolute;
        bottom: 0;
        left: 120px;
        width: 60px;
        height: 260px;
        background: #8d6e63;
        border-radius: 20px;
    }

    /* 잎 */
    .leaf {
        position: absolute;
        font-size: 18px;
        animation: pop 0.4s ease;
        z-index: 5;
    }

    @keyframes pop {
        from { transform: scale(0); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    /* 기록 */
    #log {
        width: 80%;
        max-width: 750px;
        margin: 20px auto;
        background: rgba(255,255,255,0.9);
        padding: 10px;
        border-radius: 10px;
    }

    .log-item {
        border-bottom: 1px solid #ddd;
        padding: 6px;
        font-size: 14px;
    }

    .name {
        font-weight: bold;
        color: #2e7d32;
    }
</style>
</head>

<body>

<header>
    <h1>🌳 노담나무 만들기</h1>
    <h2>흡연 권유 거절, 노담 실천 문구 작성하기</h2>
</header>

<div class="input-box">
    <input id="nameInput" placeholder="학생 이름" />
    <input id="textInput" placeholder="문장 입력 (예: 담배 안 피워요!)" />
    <button onclick="addEntry()">추가</button>
</div>

<div id="tree-container">
    <div id="tree-area">

        <!-- 🌿 귀여운 나무 -->
        <div class="tree">
            <div class="crown"></div>
            <div class="crown2"></div>
            <div class="crown3"></div>
            <div class="trunk"></div>
        </div>

    </div>
</div>

<div id="log">
    <b>📌 작성 기록</b>
</div>

<script>
const treeArea = document.getElementById("tree-area");
const log = document.getElementById("log");

let count = 0;

function addEntry() {
    const name = document.getElementById("nameInput").value.trim();
    const text = document.getElementById("textInput").value.trim();

    if (!name || !text) return;

    // 기록
    const item = document.createElement("div");
    item.className = "log-item";
    item.innerHTML = `<span class="name">${name}</span> : ${text}`;
    log.appendChild(item);

    // 🌳 나무 “잎 내부 영역” (크라운 안쪽만)
    const x = Math.random() * 220 + 140;
    const y = Math.random() * 220 + 80;

    const leaf = document.createElement("div");
    leaf.className = "leaf";

    const types = ["🍃", "🌸", "🍁"];
    leaf.innerText = types[Math.floor(Math.random() * types.length)];

    leaf.style.left = x + "px";
    leaf.style.top = y + "px";

    treeArea.appendChild(leaf);

    count++;
}
</script>

</body>
</html>
