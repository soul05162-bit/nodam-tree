<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>노담나무 만들기</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(#cfefff, #f3fbff);
    }

    header {
        text-align: center;
        padding: 18px;
    }

    h1 {
        margin: 10px 0 5px;
        font-size: 34px;
        color: #2e7d32;
    }

    h2 {
        margin: 0;
        font-weight: normal;
        color: #4f7c5a;
    }

    .input-box {
        text-align: center;
        margin: 15px;
    }

    input {
        width: 180px;
        padding: 10px;
        margin: 4px;
    }

    button {
        padding: 10px 14px;
        background: #2e7d32;
        color: white;
        border: none;
        cursor: pointer;
    }

    button:hover {
        background: #1b5e20;
    }

    /* 흰 박스 */
    #tree-box {
        width: 560px;
        height: 720px;
        margin: 0 auto;
        background: white;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        position: relative;
        overflow: hidden;
    }

    #tree-area {
        position: relative;
        width: 100%;
        height: 100%;
    }

    svg {
        position: absolute;
        left: 0;
        top: 0;
    }

    /* 잎 */
    .leaf {
        position: absolute;
        font-size: 18px;
        animation: pop 0.3s ease;
    }

    @keyframes pop {
        from { transform: scale(0); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    /* 기록 */
    #log {
        width: 80%;
        max-width: 750px;
        margin: 20px auto;
        background: rgba(255,255,255,0.9);
        padding: 10px;
        border-radius: 10px;
    }

    .log-item {
        border-bottom: 1px solid #ddd;
        padding: 6px;
        font-size: 14px;
    }

    .name {
        font-weight: bold;
        color: #2e7d32;
    }
</style>
</head>

<body>

<header>
    <h1>🌳 노담나무 만들기</h1>
    <h2>흡연 권유 거절, 노담 실천 문구 작성하기</h2>
</header>

<div class="input-box">
    <input id="nameInput" placeholder="학생 이름" />
    <input id="textInput" placeholder="문장 입력" />
    <button onclick="addEntry()">추가</button>
</div>

<!-- 흰 박스 -->
<div id="tree-box">
    <div id="tree-area">

        <!-- 나무 -->
        <svg width="560" height="720">
            <ellipse cx="280" cy="230" rx="160" ry="120" fill="#2e7d32"/>
            <ellipse cx="200" cy="320" rx="120" ry="100" fill="#388e3c"/>
            <ellipse cx="360" cy="320" rx="120" ry="100" fill="#388e3c"/>
            <ellipse cx="280" cy="160" rx="110" ry="90" fill="#43a047"/>

            <rect x="260" y="380" width="40" height="260" fill="#6d4c41"/>
        </svg>

    </div>
</div>

<div id="log">
    <b>📌 작성 기록</b>
</div>

<script>
const treeArea = document.getElementById("tree-area");
const log = document.getElementById("log");

const usedPositions = [];

function getNonOverlappingPosition() {
    let x, y;

    for (let i = 0; i < 50; i++) {
        x = Math.random() * 260 + 140;
        y = Math.random() * 260 + 120;

        let ok = true;

        for (let p of usedPositions) {
            const dx = p.x - x;
            const dy = p.y - y;
            if (Math.sqrt(dx*dx + dy*dy) < 28) {
                ok = false;
                break;
            }
        }

        if (ok) {
            usedPositions.push({x, y});
            return {x, y};
        }
    }

    return {x, y};
}

function addEntry() {
    const name = document.getElementById("nameInput").value.trim();
    const text = document.getElementById("textInput").value.trim();

    if (!name || !text) return;

    // 기록
    const item = document.createElement("div");
    item.className = "log-item";
    item.innerHTML = `<span class="name">${name}</span> : ${text}`;
    log.appendChild(item);

    // 🌿 위치
    const pos = getNonOverlappingPosition();

    const leaf = document.createElement("div");
    leaf.className = "leaf";

    // 🍃 + 🌸만 사용 (단풍 제거)
    const types = ["🍃", "🌸"];
    leaf.innerText = types[Math.floor(Math.random() * types.length)];

    leaf.style.left = pos.x + "px";
    leaf.style.top = pos.y + "px";

    treeArea.appendChild(leaf);
}
</script>

</body>
</html>
