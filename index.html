<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>노담나무 푸릇푸릇한</title>
<style>
    body {
        margin: 0;
        font-family: 'Arial', sans-serif;
        background: linear-gradient(to top, #c6f6d5, #e6fffa, #f0fff4);
        overflow: hidden;
    }

    h1 {
        text-align: center;
        margin-top: 20px;
        color: #22543d;
    }

    h3 {
        text-align: center;
        margin-top: -10px;
        color: #2f855a;
        font-weight: normal;
    }

    #container {
        position: relative;
        width: 100vw;
        height: 90vh;
    }

    /* 나무 */
    #tree {
        position: absolute;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        width: 350px;
        height: 500px;
        background: url("https://i.imgur.com/3ZQ3Z9M.png");
        background-size: contain;
        background-repeat: no-repeat;
    }

    /* 생성되는 요소 */
    .item {
        position: absolute;
        font-size: 26px;
        pointer-events: none;
        animation: pop 0.4s ease;
    }

    @keyframes pop {
        from { transform: scale(0); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    #btn {
        position: absolute;
        top: 20px;
        right: 20px;
        padding: 10px 15px;
        border: none;
        background: #38a169;
        color: white;
        border-radius: 10px;
        cursor: pointer;
    }
</style>
</head>

<body>

<h1>노담나무 푸릇푸릇한</h1>
<h3>“담배 없이도 충분히 푸르게 자라요”</h3>

<div id="container">
    <div id="tree"></div>
    <button id="btn">하나 추가 🌱</button>
</div>

<script>
const tree = document.getElementById("tree");
const btn = document.getElementById("btn");

let index = 0;
const items = ["🍃", "🌸", "🍁"];

// 나무 영역 내부 랜덤 좌표 생성
function getRandomPosition() {
    const rect = tree.getBoundingClientRect();

    // 나무 내부만 (중앙 기준 살짝 위쪽 집중)
    const x = rect.left + Math.random() * rect.width;
    const y = rect.top + Math.random() * (rect.height * 0.75);

    return { x, y };
}

btn.addEventListener("click", () => {
    const item = document.createElement("div");
    item.className = "item";
    item.innerText = items[index];

    const pos = getRandomPosition();
    item.style.left = pos.x + "px";
    item.style.top = pos.y + "px";

    document.body.appendChild(item);

    index = (index + 1) % items.length;
});
</script>

</body>
</html>
