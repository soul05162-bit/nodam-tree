<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노담나무 만들기</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Malgun Gothic', sans-serif;
        background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    header {
        text-align: center;
        padding: 25px 10px 15px;
    }

    h1 {
        margin: 0 0 8px 0;
        font-size: 36px;
        color: #1b5e20;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: #43a047;
    }

    .input-box {
        background: white;
        padding: 15px 25px;
        border-radius: 50px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
        align-items: center;
        z-index: 10;
    }

    input {
        padding: 10px 15px;
        border: 2px solid #a5d6a7;
        border-radius: 25px;
        font-size: 14px;
        outline: none;
        transition: 0.3s;
    }

    input:focus {
        border-color: #4caf50;
    }

    #nameInput { width: 90px; text-align: center; }
    #textInput { width: 25px; flex-grow: 1; min-width: 220px; }

    button {
        padding: 10px 22px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #2e7d32;
        transform: scale(1.05);
    }

    #growth-msg {
        font-size: 16px;
        font-weight: bold;
        color: #2e7d32;
        background: rgba(255,255,255,0.8);
        padding: 5px 15px;
        border-radius: 20px;
        margin-bottom: 15px;
    }

    /* 메인 캔버스 박스 */
    #tree-box {
        width: 600px;
        height: 600px;
        background: white;
        border-radius: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        position: relative;
        overflow: hidden;
        border: 4px solid #ffffff;
    }
    
    /* [기본 틀 고정] 화면 왜곡 없는 고해상도 백그라운드 나무 일러스트 장착 */
    #tree-bg-container {
        position: absolute;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1;
    }

    #base-tree-img {
        width: 480px;
        height: 480px;
        object-fit: contain;
        transform: scale(0.85);
        transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* 잎사귀가 돋아나는 정밀 좌표 레이어 */
    #tree-area {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 2;
    }

    .leaf {
        position: absolute;
        font-size: 28px;
        transform: translate(-50%, -50%) scale(0);
        animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        user-select: none;
    }

    @keyframes pop {
        to { transform: translate(-50%, -50%) scale(1); }
    }

    #log {
        width: 600px;
        max-height: 200px;
        margin: 25px 0 40px;
        background: rgba(255, 255, 255, 0.9);
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        overflow-y: auto;
        box-sizing: border-box;
    }

    #log b {
        color: #1b5e20;
        font-size: 16px;
        display: block;
        margin-bottom: 10px;
        border-bottom: 2px solid #c8e6c9;
        padding-bottom: 5px;
    }

    .log-item {
        border-bottom: 1px dashed #e0e0e0;
        padding: 8px 5px;
        font-size: 14px;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-50%); }
        to { opacity: 1; transform: translateY(0); }
    }

    .name {
        font-weight: bold;
        color: #2e7d32;
        background: #e8f5e9;
        padding: 2px 8px;
        border-radius: 10px;
        margin-right: 5px;
    }
</style>
</head>

<body>

<header>
    <h1>🌳 노담나무 🌳</h1>
    <h2>흡연 권유 거절, 노담 실천 문구 작성하기</h2>
</header>

<div class="input-box">
    <input id="nameInput" placeholder="이름" maxlength="5"/>
    <input id="textInput" placeholder="예) 담배는 우리 몸을 아프게 해! 안 피울 거야!" />
    <button onclick="addEntry()">나무 가꾸기</button>
</div>

<div id="growth-msg">🌱 현재 나무 상태: 아기 씨앗 단계 (잎 0개)</div>

<div id="tree-box">
    <div id="tree-bg-container">
        <img id="base-tree-img" src="https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?auto=format&fit=crop&q=80&w=600" style="display:none;">
        <span id="fallback-tree" style="font-size: 300px; transition: transform 0.5s ease;">🌳</span>
    </div>
    <div id="tree-area"></div>
</div>

<div id="log">
    <b>📌 우리가 만든 노담 기록장</b>
    <div id="log-list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyALLfaAws-3eXrnb_gBv9ynEZBuJMc6AGg",
  authDomain: "tree-8c864.firebaseapp.com",
  projectId: "tree-8c864",
  storageBucket: "tree-8c864.firebasestorage.app",
  messagingSenderId: "434728258229",
  appId: "1:434728258229:web:ac4d19f209c21d25a6ccfc",
  measurementId: "G-D0KRL6KJ06"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore(); 

const treeArea = document.getElementById("tree-area");
const logList = document.getElementById("log-list");
const fallbackTree = document.getElementById("fallback-tree");
const growthMsg = document.getElementById("growth-msg");

let leafCount = 0; 

// 나무 몸통 크기 성장 엔진 수정
function updateTreeGrowth() {
    let scale = 1.0;
    let statusText = "";

    if (leafCount === 0) { scale = 0.8; statusText = "🌱 아기 씨앗 단계 (잎 0개)"; }
    else if (leafCount <= 3) { scale = 0.9; statusText = "🌿 새싹 단계 (첫 걸음마!)"; }
    else if (leafCount <= 7) { scale = 1.0; statusText = "🌳 성장기 단계 (나무가 자라나요)"; }
    else if (leafCount <= 12) { scale = 1.12; statusText = "🌿 풍성 단계 (초록 잎이 가득!)"; }
    else if (leafCount <= 18) { scale = 1.22; statusText = "🌸 꽃길 단계 (꽃이 활짝 피어납니다)"; }
    else { scale = 1.30; statusText = "👑 울창한 노담 숲 단계 (최고의 노담 나무 탄생!)"; }

    fallbackTree.style.transform = `scale(${scale})`;
    growthMsg.innerText = `✨ 현재 나무 상태: ${statusText}`;
}

updateTreeGrowth();

// [정밀 타원 안착 시스템] 가로형 타원 구역 내부에만 정확히 잎사귀 배치 (절대 밖으로 못 나감)
function getSpiralPosition(index) {
    const centerX = 300; // 박스 정중앙 가로축
    const centerY = 240; // 나무 머리가 모여있는 최적의 세로축
    
    // 황금비 분산 공식 (절대 뭉치거나 겹치지 않음)
    const angle = index * 2.39996; 
    const radius = 22 * Math.sqrt(index + 1); 

    // 나무 이모지의 초록 구역 모양(가로로 넓적한 형태)에 100% 대응하도록 수학적 압축
    const x = centerX + Math.cos(angle) * radius * 1.35;
    const y = centerY + Math.sin(angle) * radius * 0.95;

    return { x: Math.round(x), y: Math.round(y) };
}

function addEntry() {
    const nameInput = document.getElementById("nameInput");
    const textInput = document.getElementById("textInput");
    const name = nameInput.value.trim();
    const text = textInput.value.trim();

    if (!name || !text) {
        alert("이름과 노담 문장을 모두 입력해주세요! 😊");
        return;
    }

    const items = ["🍃", "🌸", "🌿", "🍀", "🌼", "🌱"];
    const randomLeaf = items[Math.floor(Math.random() * items.length)];

    db.collection("nodamTree").add({
        studentName: name,
        nodamText: text,
        leafType: randomLeaf,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    })
    .then(() => {
        textInput.value = "";
        textInput.focus();
    })
    .catch((error) => { console.error("데이터 저장 실패: ", error); });
}

// 실시간 동기화 렌더러
db.collection("nodamTree")
    .orderBy("timestamp", "asc")
    .onSnapshot((snapshot) => {
        treeArea.innerHTML = "";
        logList.innerHTML = "";
        leafCount = 0;            

        snapshot.forEach((doc) => {
            const data = doc.data();
            const name = data.studentName;
            const text = data.nodamText;
            const leafType = data.leafType || "🍃";

            // 1. 하단 보드 리스트업
            const item = document.createElement("div");
            item.className = "log-item";
            item.innerHTML = `<span class="name">${name}</span> ${text}`;
            logList.insertBefore(item, logList.firstChild);

            // 2. 누적 순번에 맞춘 나선 계산 (안 겹치고 중앙부터 빽빽하게 채움)
            const pos = getSpiralPosition(leafCount);

            const leaf = document.createElement("div");
            leaf.className = "leaf";
            leaf.innerText = leafType;
            leaf.style.left = pos.x + "px";
            leaf.style.top = pos.y + "px";

            treeArea.appendChild(leaf);
            leafCount++;
        });
        updateTreeGrowth();
    });

document.getElementById("textInput").addEventListener("keyup", function(event) {
    if (event.key === "Enter") { addEntry(); }
});
</script>
</body>
</html>
